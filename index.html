<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calc Demo</title>
</head>
<body>
    <h1><i class="fa-solid fa-calculator"></i>LET'S HAVE SOME FUM!</h1>
   <div class="calculator">
    <div class="screen">
        <div class="calculation">
            260 + 10 =
        </div>
        <div class="result">
            270
        </div>
    </div>
    <div class="action">
        <button style="background-color: palevioletred;">CLEAR</button>
        <button style="background-color: purple;">DELETE</button>
    </div>
    <div class="buttons">
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>&divide;</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>&times;</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>&minus;</button>

        <button>.</button>
        <button>0</button>
        <button>=</button>
        <button>+</button>
    </div>
   </div>
   <script src="https://kit.fontawesome.com/a9cdbedf57.js" crossorigin="anonymous"></script>
</body>
</html>
